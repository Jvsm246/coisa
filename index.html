<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repositório coisa</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            text-align: center;
            animation: slideIn 0.5s ease-out;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }
        
        .repo-link {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            padding: 15px 40px;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: 600;
            margin-bottom: 20px;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }
        
        .repo-link:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.6);
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
        }
        
        .repo-info {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 20px;
            text-align: left;
            border-radius: 8px;
            margin-top: 30px;
        }
        
        .repo-info h3 {
            color: #333;
            margin-bottom: 10px;
            font-size: 1.2em;
        }
        
        .repo-info p {
            color: #666;
            line-height: 1.6;
            margin: 8px 0;
        }
        
        .info-row {
            display: flex;
            justify-content: space-between;
            margin: 8px 0;
            font-size: 0.95em;
        }
        
        .icon {
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 coisa</h1>
        <p class="subtitle">Repositório no GitHub</p>
        
        <a href="https://github.com/Jvsm246/coisa" class="repo-link" target="_blank">
            📍 Acessar Repositório
        </a>
        
        <div class="repo-info">
            <h3>Informações do Repositório</h3>
            <div class="info-row">
                <span><span class="icon">👤</span> Proprietário:</span>
                <strong>Jvsm246</strong>
            </div>
            <div class="info-row">
                <span><span class="icon">📦</span> Nome:</span>
                <strong>coisa</strong>
            </div>
            <div class="info-row">
                <span><span class="icon">👁️</span> Visibilidade:</span>
                <strong>Público</strong>
            </div>
            <div class="info-row">
                <span><span class="icon">🌿</span> Branch Padrão:</span>
                <strong>main</strong>
            </div>
            <div class="info-row">
                <span><span class="icon">🔗</span> URL:</span>
                <strong>github.com/Jvsm246/coisa</strong>
            </div>
        </div>
    </div>
</body>
</html>
